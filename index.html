<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Art Academy</title><style>body{font-family:system-ui;background:#fff7ed;color:#29334a;margin:0}header{padding:22px;background:white;font-size:24px;font-weight:900}main{max-width:960px;margin:auto;padding:25px}h1{font-size:clamp(30px,5vw,50px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.card,.stage{background:white;border:1px solid #f0e4d9;border-radius:22px;padding:20px;box-shadow:0 7px 20px #0001}.card{cursor:pointer;text-align:center;font-size:20px}.emoji{font-size:74px}button{cursor:pointer;border:0;border-radius:14px;padding:15px;background:#34415a;color:white;font-size:17px;font-weight:bold;margin:5px}#lesson{display:none}.stage{text-align:center}svg{width:100%;height:350px;max-width:480px}p{font-size:18px;line-height:1.5}</style><header>🎨 Little Art Academy</header><main><section id="home"><h1>Let's draw animal friends! ✨</h1><p>Grab your pencil and paper, choose an animal, and follow each drawing step.</p><div class="grid" id="cards"></div></section><section id="lesson"><button onclick="home()">← All animals</button><h1 id="title"></h1><div class="stage"><svg id="svg" viewBox="0 0 320 300"></svg><h2 id="instruction"></h2><p id="hint"></p><button onclick="draw()">↻ Replay</button><button onclick="back()">← Back</button><button onclick="next()">Next →</button></div></section></main><script>
const C=(x,y,r)=>'M '+(x+r)+' '+y+' a '+r+' '+r+' 0 1 0 '+(-2*r)+' 0 a '+r+' '+r+' 0 1 0 '+(2*r)+' 0';
const E=(x,y,a,b)=>'M '+(x+a)+' '+y+' a '+a+' '+b+' 0 1 0 '+(-2*a)+' 0 a '+a+' '+b+' 0 1 0 '+(2*a)+' 0';
const animals=[['Kitten','🐱'],['Puppy','🐶'],['Bunny','🐰'],['Panda','🐼'],['Bear','🐻'],['Fox','🦊'],['Owl','🦉'],['Frog','🐸'],['Dragon','🐉'],['Dolphin','🐬']];
let animal=0,step=0;const lessons=[['Draw a round head','Start with a big circle.',[C(160,130,75)]],['Add the ears','Draw two pointy ears.', ['M103 84 L98 36 L140 64','M180 64 L222 36 L217 84']],['Draw the eyes','Two friendly little eyes.',[C(132,127,9),C(188,127,9)]],['Nose and smile','Give your animal a happy face.', ['M150 154 L170 154 L160 165 Z','M160 165 Q144 183 131 166','M160 165 Q176 183 189 166']],['Draw the body','A little oval under the head.',[E(160,241,56,40)]],['Add paws and a tail','Finish your drawing!',[E(131,267,18,11),E(190,267,18,11),'M215 250 Q279 244 249 192']]];
document.getElementById('cards').innerHTML=animals.map((a,i)=>'<button class="card" onclick="openAnimal('+i+')"><div class="emoji">'+a[1]+'</div><b>'+a[0]+'</b><p>6 easy steps</p></button>').join('');
function openAnimal(i){animal=i;step=0;document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';document.getElementById('title').textContent='Draw a '+animals[i][0]+' '+animals[i][1];draw();window.scrollTo(0,0)}
function home(){document.getElementById('home').style.display='block';document.getElementById('lesson').style.display='none'}
function draw(){const svg=document.getElementById('svg');svg.innerHTML='';document.getElementById('instruction').textContent='Step '+(step+1)+' of 6 — '+lessons[step][0];document.getElementById('hint').textContent=lessons[step][1];for(let j=0;j<=step;j++)for(const d of lessons[j][2]){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',j===step?'#e08c73':'#35435b');p.setAttribute('stroke-width',4);p.setAttribute('stroke-linecap','round');svg.appendChild(p);if(j===step){let n=p.getTotalLength();p.animate([{strokeDasharray:n,strokeDashoffset:n},{strokeDasharray:n,strokeDashoffset:0}],{duration:1300,fill:'forwards'})}}}
function back(){if(step>0){step--;draw()}}function next(){if(step<5){step++;draw()}else{alert('🎉 Great job! Your drawing is complete!');home()}}
</script></html>
