function art(i,preview=false){const paths=specs[i].flatMap((step)=>step.slice(1));const extras=decorations[i]||[];return '<svg viewBox="0 0 320 300" aria-label="'+animals[i][0]+' drawing" style="'+(preview?'height:165px;width:100%;max-width:200px;background:transparent':'')+'">'+paths.concat(extras).map(d=>'<path d="'+d+'" fill="none" stroke="#35435b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>').join('')+'</svg>'}
document.getElementById('cards').innerHTML=animals.map((a,i)=>'<button class="card" onclick="openAnimal('+i+')">'+art(i,true)+'<b>'+a[0]+'</b><p>✏️ Step-by-step drawing</p></button>').join('');
function openAnimal(i){animal=i;step=0;document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block';document.getElementById('title').textContent='Draw a '+animals[i][0]+' '+animals[i][1];draw();window.scrollTo(0,0)}
function home(){document.getElementById('home').style.display='block';document.getElementById('lesson').style.display='none'}
function draw(){const svg=document.getElementById('svg');svg.innerHTML='';if(step===specs[animal].length){step=specs[animal].length-1;document.getElementById('instruction').textContent='Finished! Compare every line with your paper.';}document.getElementById('instruction').textContent='Step '+(step+1)+' of '+specs[animal].length+' — '+specs[animal][step][0];document.getElementById('hint').textContent='Draw the highlighted lines on your paper.';for(let j=0;j<=step;j++)for(const d of specs[animal][j].slice(1)){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',j===step?'#e08c73':'#35435b');p.setAttribute('stroke-width',j===step?4.5:3.5);p.setAttribute('stroke-linecap','round');svg.appendChild(p);if(j===step){let n=p.getTotalLength();p.animate([{strokeDasharray:n,strokeDashoffset:n},{strokeDasharray:n,strokeDashoffset:0}],{duration:1800,fill:'forwards'})}}if(step===specs[animal].length-1){for(const d of decorations[animal]){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#d99b9a');p.setAttribute('stroke-width','2');p.setAttribute('stroke-linecap','round');svg.appendChild(p)}}}
function back(){if(step>0){step--;draw()}}function next(){if(step<specs[animal].length-1){step++;draw()}else{step=specs[animal].length;draw()}}
